# A production-like run on one machine: Postgres, the migrations, then the API.
#   cp deploy/.env.example deploy/.env   # and fill it in
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up --build
name: tsundoku

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    command: ["--connection", "Host=postgres;Database=appdb;Username=app;Password=${POSTGRES_PASSWORD}"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      ConnectionStrings__appdb: "Host=postgres;Database=appdb;Username=app;Password=${POSTGRES_PASSWORD}"
      Accounts__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env}
      Accounts__SignUpEnabled: ${SIGNUP_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: tsundoku-api
    ports:
      - "8080:8080"
    # Longer than HostOptions.ShutdownTimeout (25 s), so in-flight requests finish before SIGKILL (tip 18.08).
    stop_grace_period: 35s
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
