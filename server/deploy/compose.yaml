# A production-like run on one machine: Postgres, Valkey, the migrations, then the API.
#   cp deploy/.env.example deploy/.env   # and fill it in
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up --build
name: tsundoku

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ephemeral: the rate-limit buckets and the Google replay records may vanish on a restart.
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The deploy step: every module's migrations as the owner, then the tsundoku_api login. Exits when done.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    command: ["migrate"]
    environment:
      ConnectionStrings__appdb-owner: "Host=postgres;Database=appdb;Username=app;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__appdb: "Host=postgres;Database=appdb;Username=tsundoku_api;Password=${APP_DB_PASSWORD}"
      ConnectionStrings__valkey: valkey:6379
      Accounts__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      # The API never gets the owner connection string: its role cannot change the schema or bypass RLS.
      ConnectionStrings__appdb: "Host=postgres;Database=appdb;Username=tsundoku_api;Password=${APP_DB_PASSWORD}"
      ConnectionStrings__valkey: valkey:6379
      Accounts__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env}
      Accounts__SignUpEnabled: ${SIGNUP_ENABLED:-false}
      Accounts__Google__ClientIds__0: ${GOOGLE_CLIENT_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: tsundoku-api
    ports:
      - "127.0.0.1:8080:8080"
    # Longer than HostOptions.ShutdownTimeout (25 s), so in-flight requests finish before SIGKILL (tip 18.08).
    stop_grace_period: 35s
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
